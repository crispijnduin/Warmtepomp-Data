---
name: Warmtepomp Data
version: "1.2.3"
slug: warmtepomp_data
description: Legt alle beschikbare data van de warmtepomp vast in een eigen database
url: 'https://github.com/crispijnduin/Warmtepomp-Data/tree/main/warmtepomp_data'
arch:
  - aarch64
  - amd64
  - armv7
init: false
# De database komt in /share/warmtepomp, zodat hij app-updates overleeft en
# meegaat in de gewone Home Assistant-back-up.
map:
  - share:rw
# Geeft toegang tot de Home Assistant-API via de Supervisor, zodat er geen
# eigen toegangstoken nodig is.
homeassistant_api: true
options:
  integrations: weheat
  devices: ""
  extra_entities: ""
  exclude_entities: ""
  snapshot_interval: 300
  rediscover_interval: 3600
  store_attributes: true
  backfill_days: 400
  publish_digest: true
  digest_interval: 300
  answer_queries: true
  log_level: INFO
  ha_url: ""
  ha_token: ""
schema:
  integrations: str
  devices: str?
  extra_entities: str?
  exclude_entities: str?
  snapshot_interval: int(10,86400)
  rediscover_interval: int(0,86400)
  store_attributes: bool
  backfill_days: int(0,3650)
  publish_digest: bool
  digest_interval: int(60,86400)
  answer_queries: bool
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  ha_url: str?
  ha_token: str?
